name: AppImage

on:
  workflow_dispatch:
    inputs:
      bundle_ffmpeg:
        description: "Also build a variant with ffmpeg bundled"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        bundle_ffmpeg: [false, true]
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build AppImage (appimage-builder)
        env:
          VERSION: ${{ env.VERSION }}
          BUNDLE_FFMPEG: ${{ matrix.bundle_ffmpeg && '1' || '0' }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.bundle_ffmpeg }}" == "false" && "${{ matrix.bundle_ffmpeg }}" == "true" ]]; then
              echo "Skipping ffmpeg-bundled variant (workflow_dispatch)."
              exit 0
            fi
          fi

          docker run --rm \
            -e VERSION \
            -e BUNDLE_FFMPEG \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:22.04 \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y \
                python3 \
                python3-venv \
                python3-pip \
                build-essential \
                libasound2-dev \
                patchelf \
                desktop-file-utils \
                curl \
                git \
                libfuse2
              python3 -m pip install -U pip
              python3 -m pip install -U appimage-builder
              if [[ "${BUNDLE_FFMPEG}" == "1" ]]; then
                apt-get install -y ffmpeg
              fi
              ./packaging/appimage/build-appdir.sh
              appimage-builder --recipe appimage-builder.yml
            '

      - name: Scan missing libs on failure
        if: failure()
        run: |
          if [[ -d ".appimage-build/AppDir" ]]; then
            find .appimage-build/AppDir \
              \( -type f -perm -u+x -o -name "*.so" \) \
              -print0 \
              | xargs -0 -r ldd 2>/dev/null \
              | grep -B1 "not found" || true
          else
            echo "No AppDir found to scan."
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.bundle_ffmpeg && 'with-ffmpeg' || 'no-ffmpeg' }}
          path: dist/*.AppImage
