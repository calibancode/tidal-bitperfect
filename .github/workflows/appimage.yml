name: AppImage

on:
  workflow_dispatch:
    inputs:
      bundle_ffmpeg:
        description: "Also build a variant with ffmpeg bundled"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        bundle_ffmpeg: [false, true]
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            patchelf \
            desktop-file-utils

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          python -m pip install -U pyinstaller
          python -m pip install -r requirements.txt

      - name: Download linuxdeploy
        run: |
          mkdir -p .appimage-tools
          curl -L -o .appimage-tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x .appimage-tools/linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        env:
          VERSION: ${{ env.VERSION }}
          LINUXDEPLOY: ${{ github.workspace }}/.appimage-tools/linuxdeploy-x86_64.AppImage
          BUNDLE_FFMPEG: ${{ matrix.bundle_ffmpeg && '1' || '0' }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.bundle_ffmpeg }}" == "false" && "${{ matrix.bundle_ffmpeg }}" == "true" ]]; then
              echo "Skipping ffmpeg-bundled variant (workflow_dispatch)."
              exit 0
            fi
          fi

          if [[ "${BUNDLE_FFMPEG}" == "1" ]]; then
            # Prefer bundling a known ffmpeg build instead of depending on the runner's package.
            # Note: licensing/feature set depends on the upstream build you choose.
            sudo apt-get install -y ffmpeg
          fi

          ./packaging/appimage/build.sh

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.bundle_ffmpeg && 'with-ffmpeg' || 'no-ffmpeg' }}
          path: dist/*.AppImage
