[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-bitperfect"
version = "0.2.0"
description = "TIDAL -> ffmpeg -> direct ALSA output (PySide6 GUI + legacy CLI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tidalapi>=0.8.10",
  "PySide6>=6.5",
  "pyalsaaudio>=0.10; platform_system == 'Linux'",
  "soundfile>=0.12",
  "mutagen>=1.47",
]

[project.scripts]
tidal-bitperfect = "tidal_app:main"

[tool.setuptools]
py-modules = ["tidal_app", "tidal_core", "tidal_bitperfect"]
