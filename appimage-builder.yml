version: 1

AppDir:
  path: .appimage-build/AppDir
  app_info:
    id: tidal-bitperfect
    name: TIDAL Bitperfect
    icon: tidal-bitperfect
    version: "{{VERSION}}"
    exec: usr/bin/tidal-bitperfect
  apt:
    arch: amd64
    sources:
      - sourceline: "deb http://archive.ubuntu.com/ubuntu/ jammy main universe"
      - sourceline: "deb http://archive.ubuntu.com/ubuntu/ jammy-updates main universe"
    include:
      - libasound2
      - libdbus-1-3
      - libdrm2
      - libegl1
      - libfontconfig1
      - libfreetype6
      - libgbm1
      - libgl1
      - libglib2.0-0
      - libnss3
      - libnspr4
      - libpulse0
      - libtiff5
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libxcomposite1
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-render0
      - libxcb-shape0
      - libxcb-xfixes0
      - libxcursor1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxi6
      - libxkbcommon0
      - libxrandr2
      - libxrender1
      - libxss1
      - libxtst6

AppImage:
  arch: x86_64
